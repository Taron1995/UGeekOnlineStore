[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "videoanalytics"
version = "0.1.0"
description = "Offline video analytics MVP: people counting and machine activity from multi-day CCTV recordings"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless", "onnxruntime", "pyyaml"]

[project.scripts]
vidan = "videoanalytics.cli:main"

[tool.setuptools]
packages = ["videoanalytics"]
