# Coordinates are normalized to the frame: x 0..1 (left->right), y 0..1 (top->bottom).
# Run `python -m videoanalytics snap ...` to get a snapshot per camera with a grid to read them off.
options:
  fps: 3                    # frames per second that are analysed (source can be 25 fps)
  conf: 0.35                # person confidence
  active_hours: [[8, 20]]   # optional: only analyse these hours of the day (wall-clock of the recording)
  gate_motion: 0.0005       # skip the detector in a still scene (share of changed pixels); keepalive_s forces a check
  keepalive_s: 3
  clips: true
  max_clips_per_file: 10
cameras:
  cam1:                     # name is searched in the file path as a whole word: cam1_2026..., /cam1/...
    # match: "ch0?1|channel_1"   # optional regex on the relative path instead of the name
    zones:
      - {name: station_A, polygon: [[0.1,0.3],[0.5,0.3],[0.5,0.9],[0.1,0.9]]}
    lines:                  # people counting; "in" = crossing from the right side to the left side of p1->p2
      - {name: door, p1: [0.2,0.6], p2: [0.8,0.6]}
    machine: {polygon: [[0.5,0.2],[0.9,0.2],[0.9,0.8],[0.5,0.8]], motion_thr: 0.02, window_s: 10}
  cam2: {machine: {polygon: [[0.2,0.2],[0.8,0.2],[0.8,0.8],[0.2,0.8]]}}
  cam3: {}
  cam4: {}
  cam5: {}
  cam6: {}
