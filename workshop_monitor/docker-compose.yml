# Закрытый контур: все сервисы локально, внешний интернет после сборки не нужен.
# Секреты задайте в .env (см. .env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD}
      POSTGRES_DB: monitor
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U monitor"], interval: 5s, retries: 10}

  worker:                      # анализ видео. Для GPU: см. README (nvidia runtime)
    build: .
    depends_on: {db: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:${DB_PASSWORD}@db:5432/monitor
    volumes: [./config:/app/config:ro, ./video:/app/video, ./models:/app/models:ro, clips:/app/clips]
    restart: unless-stopped

  api:                         # http://localhost:8000  (логин любой, пароль = API_KEY)
    build: .
    command: python -m monitor.run api
    depends_on: {db: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:${DB_PASSWORD}@db:5432/monitor
      API_KEY: ${API_KEY:?задайте API_KEY}
    volumes: [clips:/app/clips:ro]
    ports: ["8000:8000"]
    restart: unless-stopped

  superset:                    # http://localhost:8088 ; БД: postgresql+psycopg2://monitor:...@db:5432/monitor
    build: {context: ., dockerfile: docker/Dockerfile.superset}
    depends_on: {db: {condition: service_healthy}}
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?задайте SUPERSET_SECRET_KEY}
    command: >
      bash -c "superset db upgrade &&
      superset fab create-admin --username admin --firstname a --lastname a --email a@a.a --password ${SUPERSET_ADMIN_PASSWORD:?задайте SUPERSET_ADMIN_PASSWORD} || true;
      superset init && superset run -h 0.0.0.0 -p 8088"
    ports: ["8088:8088"]
    volumes: [superset:/app/superset_home]

volumes: {pgdata: {}, clips: {}, superset: {}}
