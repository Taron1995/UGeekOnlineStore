name: Yerevan Navigator offline data

# Downloads Yerevan from OpenStreetMap and builds the offline map/routing/search files
# in YerevanNavigator/data, then commits them. Runs on changes to the build script,
# on demand, and monthly to keep the map fresh.
on:
  push:
    paths:
      - 'YerevanNavigator/tools/**'
      - '.github/workflows/yerevan-offline-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write

concurrency:
  group: yerevan-offline-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build offline data from OpenStreetMap
        run: node --max-old-space-size=6144 YerevanNavigator/tools/build-offline-data.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YerevanNavigator/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Yerevan offline map data from OpenStreetMap"
          git push
